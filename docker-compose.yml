version: '3.8'
services:
  linearis-mcp:
    build: .
    container_name: linearis-mcp
    ports:
      - "8090:8080"
    environment:
      - LINEAR_API_TOKEN=${LINEAR_API_TOKEN}
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
